[project]
name = "regulation-assists"
version = "0.1.0"
description = "AI-regulation corpus: ingestion + Neo4j graph loader"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.20",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "asyncpg>=0.32.0",
    "openai>=1.0.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# strict：漏写 @pytest.mark.asyncio 的异步测试会被静默跳过而非报错；pythonpath 让 backend 包可被 import
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["backend/tests"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]
